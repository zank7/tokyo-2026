  :root{
    --ink:#1D2440; --paper:#F2F5EE; --glow:#C9F2C7; --pink:#FF5C8A; --teal:#12A594; --sun:#FFD23F; --sky:#4C6FFF;
    --day:#FF5C8A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--ink);font-size:106.25%;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:1rem;line-height:1.7;
    max-width:520px;margin-inline:auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .disp{font-family:"Dela Gothic One","Noto Sans TC",sans-serif;font-weight:400;letter-spacing:.01em}
  h1,h2,h3{margin:0;font-weight:900;line-height:1.25}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--sky);outline-offset:2px}

  /* 軟膠吊卡：硬邊框 + 實色位移陰影 */
  .slab{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
  .slab-flat{background:#fff;border:2px solid var(--ink);border-radius:14px}
  .btn{display:inline-flex;align-items:center;gap:.4rem;min-height:46px;padding:.4rem 1rem;border:2px solid var(--ink);border-radius:999px;
    background:#fff;font-weight:700;font-size:.94rem;text-decoration:none;box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .btn-ink{background:var(--ink);color:#fff}
  .btn-sun{background:var(--sun)}
  .btn-pink{background:var(--pink);color:#fff}
  .chip{display:inline-block;padding:.05rem .55rem;border:2px solid var(--ink);border-radius:999px;font-size:.75rem;font-weight:700;background:#fff;white-space:nowrap}
  .field{width:100%;min-height:50px;padding:.5rem .75rem;border:2px solid var(--ink);border-radius:10px;background:#fff;font:inherit;color:inherit}
  .field::placeholder{color:#8a90a6}

  /* 頁首 */
  .mast{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 14px;position:relative;overflow:hidden;border-bottom-left-radius:18px;border-bottom-right-radius:18px}
  .mast h1{font-size:1.75rem;line-height:1.15;color:var(--glow);padding-right:104px}
  .mast .sub{color:#cfd5ea;font-size:.85rem;margin:.3rem 0 0;padding-right:104px}
  .count{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top));background:var(--sun);color:var(--ink);border-radius:12px;
    padding:.25rem .65rem;text-align:center;transform:rotate(3deg);border:2px solid #fff;font-weight:900;font-size:.75rem;line-height:1.3}
  .count b{display:block;font-size:1.3rem;line-height:1}

  /* 吊卡式日期選擇 */
  .days{display:flex;gap:10px;overflow-x:auto;padding:16px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .daycard{flex:0 0 auto;width:106px;scroll-snap-align:start;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:20px 8px 10px;
    position:relative;text-align:center;transition:transform .12s}
  .daycard::before{content:"";position:absolute;top:7px;left:50%;width:22px;height:7px;margin-left:-11px;border-radius:99px;background:var(--paper);border:2px solid var(--ink)}
  .daycard .d{font-size:1.25rem;line-height:1.1}
  .daycard .w{font-size:.75rem;font-weight:700}
  .daycard .a{font-size:.78rem;line-height:1.3;margin-top:4px;color:#4a516b}
  .daycard[aria-selected="true"]{background:var(--c);box-shadow:4px 4px 0 var(--ink);transform:translateY(-3px)}
  .daycard[aria-selected="true"] .a{color:var(--ink)}

  /* 時間軸 */
  .tl{list-style:none;margin:0;padding:0 18px 8px 18px}
  .tl li{position:relative;padding:0 0 18px 26px}
  .tl li::before{content:"";position:absolute;left:6px;top:8px;bottom:-8px;width:2px;background:var(--ink);opacity:.25}
  .tl li:last-child::before{display:none}
  .tl li::after{content:"";position:absolute;left:0;top:6px;width:14px;height:14px;border-radius:50%;background:var(--day);border:2px solid var(--ink)}
  .tl .time{font-size:1rem;line-height:1.5;margin-bottom:6px}
  .tl .box{padding:12px 14px}
  .tl .box h3{font-size:1.12rem}
  .tl .note{font-size:.94rem;color:#3d4460;margin-top:6px}
  .tl li.key .box{background:var(--sun)}
  .tl li.key .note{color:var(--ink)}
  .tl li.key::after{background:var(--pink);width:18px;height:18px;left:-2px;top:4px}
  .stamp{display:inline-flex;align-items:center;gap:.3rem;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:8px;
    padding:0 .5rem;font-size:.78rem;font-weight:900;transform:rotate(-2deg);margin-bottom:6px}

  /* 導覽文章 */
  .article{padding:0 18px 34px}
  .article h2{font-size:1.7rem}
  .article .lead{font-size:1.05rem;font-weight:500;margin:.6rem 0 1rem}
  .article p{margin:0 0 .9rem;line-height:1.85}
  .article .kicker{font-size:.85rem;font-weight:700;color:#4a516b}
  .trivia{background:var(--glow);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin:14px 0}
  .trivia h4{margin:0 0 4px;font-size:.95rem;font-weight:900}
  .trivia ul{margin:0;padding-left:1.1rem;font-size:.92rem}
  .trivia li{margin:.25rem 0}
  .map{width:100%;height:230px;border:2px solid var(--ink);border-radius:14px;display:block;background:#dde3d6}
  .rule{height:10px;margin:0 18px 28px;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 18px);opacity:.9;border-radius:2px}

  /* 計算機 */
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .keys button{min-height:58px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:1.15rem;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
  .keys button:active{transform:translate(2px,2px);box-shadow:none}
  .keys .op{background:var(--glow)}
  .keys .eq{background:var(--pink);color:#fff}
  .keys .fn{background:var(--ink);color:#fff}
  .screen{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;min-height:96px;text-align:right;word-break:break-all}
  .screen .expr{font-size:1rem;color:#cfd5ea;min-height:1.6em}
  .screen .jpy{font-size:1.9rem;line-height:1.2;color:var(--glow)}
  .screen .twd{font-size:1rem;color:var(--sun);font-weight:700}

  /* 底部導覽 */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--ink);display:grid;grid-template-columns:repeat(5,1fr);
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));gap:4px;z-index:40;border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -4px 0 rgba(29,36,64,.12)}
  .nav button{background:none;border:0;color:#c3c9e0;min-height:54px;padding:7px 0 6px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:900;letter-spacing:.04em}
  .nav button i{font-size:1.28rem}
  .nav button[aria-selected="true"]{background:var(--glow);color:var(--ink)}


  /* 提前設定步驟 */
  .step{display:flex;gap:10px;padding:12px 0;border-top:1px solid #d9dece}
  .step:first-child{border-top:0}
  .step .no{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);display:grid;place-content:center;font-size:.9rem}
  .step.done .no{background:var(--teal);color:#fff}
  .step.done .st{text-decoration:line-through;opacity:.6}
  .step .st{font-weight:900;font-size:1rem;line-height:1.4}
  .step .sd{font-size:.9rem;margin:4px 0 0}
  .step ul{margin:6px 0 0;padding-left:1.1rem;font-size:.9rem}
  .copyrow{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:6px 6px 6px 10px;margin-top:6px}
  .copyrow .k{font-size:.75rem;color:#4a516b;line-height:1.2}
  .copyrow .v{font-weight:700;word-break:break-all;line-height:1.3}
  .copyrow button{flex:0 0 auto;min-height:36px;padding:0 .7rem;border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:700;font-size:.8rem}
  .copyrow button.ok{background:var(--teal);color:#fff}
  .donebtn{margin-top:10px;min-height:38px;padding:0 .8rem;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:.85rem}
  .step.done .donebtn{background:var(--glow)}

  /* 共同帳本 */
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .who button{min-height:40px;padding:0 .9rem;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:.9rem}
  .who button[aria-pressed="true"]{background:var(--teal);color:#fff}
  .pay{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #d9dece}
  .pay:first-child{border-top:0}
  .pay .names{flex:1;min-width:0;font-weight:900;font-size:1.02rem;line-height:1.35}
  .bal{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:.85rem;align-items:baseline}
  .bal b{font-size:.9rem}
  select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:2rem}
  /* App 內視窗 */
  dialog#sheet{width:100%;max-width:520px;height:88vh;max-height:88vh;margin:auto auto 0;padding:0;border-radius:18px 18px 0 0;border-bottom:0;overflow:hidden}
  dialog#sheet[open]{display:flex;flex-direction:column}
  #sheet .bar2{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ink);color:#fff}
  #sheet .bar2 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sheet iframe{flex:1;width:100%;border:0;background:#dde3d6}
  #sheet .foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;border-top:2px solid var(--ink)}
  .editrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:2px dashed #9aa1b8}
  .editrow button{min-height:36px;min-width:40px;padding:0 .6rem;border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:700;font-size:.8rem}
  .editrow button:disabled{opacity:.35}
  .pe label{display:block;font-weight:700;font-size:.88rem;margin-top:8px}
  .pe small{display:block;color:#4a516b;font-size:.78rem;margin-top:2px;font-weight:400}
  [hidden]{display:none!important}
  .tab{display:none}
  .tab.on{display:block}
  .sec-title{padding:22px 18px 10px;font-size:1.35rem}
  .sec-desc{padding:0 18px 12px;font-size:.9rem;color:#4a516b;margin:0}
  .pad{padding:0 18px}
  details.slab-flat{padding:0;overflow:hidden}
  details.slab-flat summary{list-style:none;padding:12px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  details.slab-flat summary::-webkit-details-marker{display:none}
  details.slab-flat[open] summary i.fa-chevron-down{transform:rotate(180deg)}
  details.slab-flat .inner{padding:0 14px 14px;font-size:.92rem}
  details.slab-flat .inner ul{margin:0;padding-left:1.1rem}
  details.slab-flat .inner li{margin:.35rem 0}
  .check{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #d9deCF}
  .check:last-child{border-bottom:0}
  .check input{appearance:none;flex:0 0 auto;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin:1px 0 0;display:grid;place-content:center}
  .check input:checked{background:var(--teal)}
  .check input:checked::after{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:#fff;font-size:.85rem}
  .check input:checked + span{text-decoration:line-through;opacity:.55}
  .bar{height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
  dialog{border:2px solid var(--ink);border-radius:16px;padding:14px;max-width:min(92vw,480px);background:#fff;color:var(--ink)}
  dialog::backdrop{background:rgba(29,36,64,.7)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<template id="shell">
<header class="mast">
  <div class="count" id="countdown" aria-live="polite"></div>
  <h1 class="disp">TOKYO 2026</h1>
  <p class="sub">12/2（三）到 12/6（日），四人同行<br>日本時間比台灣快 1 小時</p>
</header>

<main>
<!-- ============ PLAN ============ -->
<section class="tab on" id="tab-plan">
  <div class="days" id="days" role="tablist" aria-label="選擇日期"></div>
  <div class="pad" id="dayhead"></div>
  <ol class="tl" id="timeline"></ol>
  <div class="pad" id="dayextra"></div>
</section>

<!-- ============ GUIDE ============ -->
<section class="tab" id="tab-guide">
  <h2 class="sec-title">出發前讀一讀</h2>
  <p class="sec-desc">這趟會走到的地方，背後的故事和現場用得上的小知識。</p>
  <div class="pad" id="guide-toc" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px"></div>
  <div id="guide"></div>
</section>

<!-- ============ WALLET ============ -->
<section class="tab" id="tab-wallet">
  <h2 class="sec-title">匯率計算機</h2>
  <div class="pad">
    <div class="slab" style="padding:14px">
      <label style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;margin-bottom:10px">
        <span>1 日圓 =</span>
        <input id="rate" class="field" type="number" inputmode="decimal" step="0.0001" min="0" style="width:110px;min-height:40px">
        <span>台幣</span>
      </label>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 10px">
        <span id="rate-info" style="font-size:.8rem;color:#4a516b;flex:1;min-width:150px" aria-live="polite"></span>
        <button type="button" class="chip" id="rate-refresh" style="min-height:34px;background:var(--glow)"><i class="fa-solid fa-rotate"></i> 更新匯率</button>
      </div>
      <div class="screen" aria-live="polite">
        <div class="expr" id="c-expr"></div>
        <div class="jpy disp" id="c-jpy">¥0</div>
        <div class="twd" id="c-twd">約 NT$0</div>
      </div>
      <div class="keys" id="keys" style="margin-top:10px"></div>
      <button class="btn btn-sun" id="c-to-expense" style="width:100%;justify-content:center;margin-top:12px"><i class="fa-solid fa-arrow-down"></i>把這個金額記一筆</button>
    </div>
  </div>

  <h2 class="sec-title">記一筆</h2>
  <div class="pad">
    <details class="slab-flat" id="mem-box" style="margin-bottom:12px">
      <summary><span><i class="fa-solid fa-user-group"></i> 成員名字與我是誰</span><i class="fa-solid fa-chevron-down"></i></summary>
      <div class="inner">
        <p style="margin:0 0 8px">先把四個人的名字改好，大家的手機會用同一份名單。</p>
        <div id="mem-inputs" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
        <p style="margin:12px 0 6px;font-weight:700">這支手機是誰的</p>
        <div class="who" id="me-pick"></div>
      </div>
    </details>
    <form id="exp-form" class="slab" style="padding:14px;display:grid;gap:10px">
      <label style="font-weight:700;font-size:.9rem">品項
        <input id="exp-name" class="field" placeholder="例如：肉屋横丁午餐" required maxlength="40">
      </label>
      <label style="font-weight:700;font-size:.9rem">日幣金額
        <input id="exp-amt" class="field" type="number" inputmode="numeric" min="1" step="1" placeholder="3900" required>
      </label>
      <div id="exp-twd" style="font-size:.85rem;color:#4a516b"></div>
      <label style="font-weight:700;font-size:.9rem">誰先付的
        <select id="exp-payer" class="field"></select>
      </label>
      <div>
        <div style="font-weight:700;font-size:.9rem;margin-bottom:6px">這筆誰要分攤</div>
        <div class="who" id="exp-split"></div>
        <div id="exp-each" style="font-size:.85rem;color:#4a516b;margin-top:6px"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <label class="btn"><i class="fa-solid fa-camera"></i>拍照
          <input id="exp-cam" type="file" accept="image/*" capture="environment" hidden></label>
        <label class="btn"><i class="fa-solid fa-image"></i>選照片
          <input id="exp-file" type="file" accept="image/*" hidden></label>
        <img id="exp-prev" alt="已選照片預覽" hidden style="width:52px;height:52px;object-fit:cover;border:2px solid var(--ink);border-radius:10px">
        <button type="button" id="exp-clear" class="chip" hidden>移除照片</button>
      </div>
      <button class="btn btn-ink" style="justify-content:center"><i class="fa-solid fa-plus"></i>記下來</button>
    </form>
  </div>

  <h2 class="sec-title">誰要給誰多少</h2>
  <p class="sec-desc">依照每筆的墊付人和分攤人算出來，用最少的轉帳次數結清。付完按「已付清」。</p>
  <div class="pad">
    <div class="slab" style="padding:4px 14px" id="settle"></div>
    <div class="slab-flat" style="padding:12px 14px;margin-top:12px;background:var(--glow)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px"><b>全部花費</b><span><span class="disp" style="font-size:1.25rem" id="sum-jpy">¥0</span> <span style="font-size:.85rem;font-weight:700" id="sum-twd"></span></span></div>
      <div class="bal" id="bal"></div>
    </div>
  </div>

  <h2 class="sec-title">和朋友同步</h2>
  <div class="pad">
    <div class="slab-flat" style="padding:12px 14px">
      <p id="sync-msg" style="margin:0 0 10px;font-size:.9rem" aria-live="polite"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-pink" id="sync-now" hidden><i class="fa-solid fa-rotate"></i>立即同步</button>
        <button class="btn" id="sync-copy"><i class="fa-solid fa-copy"></i>複製同步碼</button>
        <button class="btn" id="sync-paste"><i class="fa-solid fa-paste"></i>貼上同步碼</button>
      </div>
      <p style="margin:10px 0 0;font-size:.8rem;color:#4a516b">同步碼是一段文字，貼到群組，朋友按「貼上同步碼」就會把兩邊的帳和行程修改合在一起，不會重複。照片只留在拍的那支手機。</p>
    </div>
  </div>

  <h2 class="sec-title">明細</h2>
  <div class="pad"><div id="exp-list" style="display:grid;gap:10px"></div></div>
</section>

<!-- ============ LISTS ============ -->
<section class="tab" id="tab-lists">
  <h2 class="sec-title">出發前先設定好</h2>
  <p class="sec-desc">每個人用自己的手機各做一次。照著步驟一格一格做，做完按「這步完成」。灰底的資料可以直接按「複製」貼上。</p>
  <div class="pad" id="setup" style="display:grid;gap:12px"></div>

  <h2 class="sec-title">行前準備</h2>
  <div class="pad">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div class="bar" style="flex:1"><i id="ck-bar" style="width:0"></i></div>
      <b id="ck-num" style="font-size:.9rem;white-space:nowrap"></b>
    </div>
    <div id="checklists" style="display:grid;gap:14px"></div>
    <form id="ck-form" style="display:flex;gap:8px;margin-top:14px">
      <input id="ck-new" class="field" placeholder="加一項自己的準備事項" maxlength="60" aria-label="新增準備事項">
      <button class="btn btn-ink" aria-label="新增"><i class="fa-solid fa-plus"></i></button>
    </form>
  </div>

  <h2 class="sec-title">個人備忘錄</h2>
  <p class="sec-desc">訂位編號、房東電話、想買的軟膠清單都可以記在這。貼上網址會變成可以點的按鈕。資料只存在這支手機。</p>
  <div class="pad">
    <form id="memo-form" style="display:grid;gap:8px">
      <textarea id="memo-text" class="field" rows="3" placeholder="寫點什麼，或貼上網址" aria-label="備忘內容"></textarea>
      <button class="btn btn-ink" style="justify-content:center"><i class="fa-solid fa-plus"></i>加到備忘錄</button>
    </form>
    <div id="memo-list" style="display:grid;gap:10px;margin-top:14px"></div>
  </div>
</section>

<!-- ============ INFO ============ -->
<section class="tab" id="tab-info">
  <div id="dl-box">
  <h2 class="sec-title">離線也能用</h2>
  <div class="pad">
    <div class="slab" style="padding:14px">
      <p style="margin:0 0 10px;font-size:.92rem">把整個 App 存成一個檔案放進手機。沒有網路時用 Safari 或 Chrome 打開它，行程、記帳、清單都能用，地圖還會在 App 內的視窗開啟。目前的共同帳本會一起帶走。</p>
      <button class="btn btn-ink" id="dl-btn"><i class="fa-solid fa-download"></i>下載離線版</button>
      <p id="dl-msg" style="margin:10px 0 0;font-size:.85rem;color:#4a516b" aria-live="polite"></p>
    </div>
  </div>
  </div>

  <h2 class="sec-title">航班與住宿</h2>
  <div class="pad" style="display:grid;gap:12px" id="info-trip"></div>

  <h2 class="sec-title">天氣</h2>
  <div class="pad">
    <div class="slab" style="padding:14px">
      <p style="margin:0 0 10px;font-size:.92rem">12 月的東京白天平均約 12°C、夜間約 4°C。保暖外套加中層和圍巾，鞋子選好走防滑的。實際預報出發前三天再查。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn btn-sun" target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/forecast/#area_type=offices&area_code=130000"><i class="fa-solid fa-cloud-sun"></i>日本氣象廳 東京預報</a>
        <a class="btn" target="_blank" rel="noopener" href="https://tenki.jp/forecast/3/16/4410/13104/"><i class="fa-solid fa-temperature-half"></i>tenki.jp 新宿區</a>
      </div>
    </div>
  </div>

  <h2 class="sec-title">緊急聯絡</h2>

function todayJST(){ return new Date(Date.now() + 9*3600e3).toISOString().slice(0,10); }
let curDay = Math.max(0, DAYS.findIndex(x => x.date === todayJST()));
function renderDays(){
  $('#days').innerHTML = DAYS.map((x,i)=>`
    <button class="daycard" role="tab" aria-selected="${i===curDay}" style="--c:${x.color}" data-i="${i}">
      <div class="d disp">${x.d}</div><div class="w">${x.w}</div><div class="a">${x.area}</div>
    </button>`).join('');
}
function placeBtns(p){
  let h = `<a class="btn" target="_blank" rel="noopener" data-map="${esc(p.q)}" href="${maps(p.q)}"><i class="fa-solid fa-location-dot"></i>${esc(p.n)}</a>`;
  if(p.food) h += `<a class="btn" target="_blank" rel="noopener" href="${blog(p.food)}" aria-label="${esc(p.n)} 食記"><i class="fa-solid fa-utensils"></i>食記</a>`;
  if(p.tel) h += `<a class="btn" href="${tel(p.tel)}" aria-label="撥打 ${esc(p.n)} ${p.tel}"><i class="fa-solid fa-phone"></i>${p.tel}</a>`;
  return h;
}
/* 行程 = 原始資料 + 使用者修改紀錄（每筆以最後修改時間為準，可同步）*/
let planEdit = false;
const isBaseId = id => /^d\d-\d+$/.test(id);
function dayItems(di){
  const recs = ledger.plan, out = [];
  DAYS[di].items.forEach((it,i)=>{
    const b = {...it, id:`d${di}-${i}`, day:di, pos:(i+1)*1000}, r = recs[b.id];
    if(!r || r.orig){ out.push(b); return; }
    if(r.del) return;
    const m = {...b, t:r.t, title:r.title, note:r.note, pos:r.pos, key:r.key?1:0, stamp:r.key ? (b.stamp || '重點') : null, edited:true, q:r.q, food:r.food};
    if(r.q){ m.places = [{n:r.q, q:r.q, food:r.food ? r.q : null}]; m.link = null; m.info = r.q; }
    out.push(m);
  });
  Object.values(recs).forEach(r=>{
    if(r.day !== di || isBaseId(r.id) || r.del) return;
    out.push({id:r.id, day:di, pos:r.pos, t:r.t, title:r.title, note:r.note, key:r.key?1:0, stamp:r.key?'重點':null, added:true, q:r.q, food:r.food,
      places:r.q ? [{n:r.q, q:r.q, food:r.food ? r.q : null}] : null, info:r.q || null});
  });
  return out.sort((x,y)=>x.pos - y.pos || x.id.localeCompare(y.id));
}
const toRec = it => ({id:it.id, day:it.day, pos:it.pos, t:it.t||'', title:it.title||'', note:it.note||'', q:it.q||'', food:!!it.food, key:!!it.key, at:Date.now()});
function renderDay(){
  const x = DAYS[curDay], items = dayItems(curDay);
  const touched = Object.values(ledger.plan).some(r=>r.day === curDay && !r.orig && !(r.del && !isBaseId(r.id)));
  document.documentElement.style.setProperty('--day', x.color);
  $('#dayhead').innerHTML = `
    <h2 style="font-size:1.45rem;margin:8px 0 6px">第 ${curDay+1} 天　${esc(x.title)}</h2>
    <p style="margin:0 0 12px;font-size:.95rem">${esc(x.theme)}</p>
    <div class="slab-flat" style="padding:10px 12px;margin-bottom:12px;font-size:.88rem;display:grid;gap:4px">
      <div><b><i class="fa-solid fa-thumbtack"></i> 一定保留</b>　${esc(x.keep)}</div>
      <div style="color:#4a516b"><b><i class="fa-solid fa-scissors"></i> 可以刪</b>　${esc(x.drop)}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
      <button class="btn ${planEdit?'btn-pink':''}" id="plan-edit" aria-pressed="${planEdit}"><i class="fa-solid fa-pen"></i>${planEdit?'完成編輯':'編輯這天的行程'}</button>
      ${planEdit?`<button class="btn" data-add="top"><i class="fa-solid fa-plus"></i>新增到最前面</button>`:''}
      ${planEdit && touched?`<button class="btn" id="plan-reset"><i class="fa-solid fa-rotate"></i>還原這天</button>`:''}
    </div>`;
  $('#timeline').innerHTML = items.map((it,idx)=>`
    <li class="${it.key?'key':''}">
      <div class="time disp">${esc(it.t || '時間未定')}</div>
      <div class="slab box">
        ${it.stamp?`<div class="stamp"><i class="fa-solid fa-bell"></i>${esc(it.stamp)}</div>`:''}
        <h3>${esc(it.title)}</h3>
        ${(it.tag||it.edited||it.added)?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          ${it.tag?`<span class="chip"><i class="fa-solid fa-clock"></i> ${esc(it.tag)}</span>`:''}
          ${it.added?`<span class="chip" style="background:var(--glow)">臨時新增</span>`:it.edited?`<span class="chip" style="background:var(--glow)">已修改</span>`:''}</div>`:''}
        ${it.note?`<p class="note" style="margin-bottom:0;white-space:pre-line">${esc(it.note)}</p>`:''}
        ${(it.places||it.link)?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
          ${(it.places||[]).map(placeBtns).join('')}
          ${it.info?`<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(it.info+' 介紹')}"><i class="fa-solid fa-book-open"></i>查介紹</a>`:''}
          ${it.link?`<a class="btn btn-ink" target="_blank" rel="noopener" href="${it.link.u}"><i class="fa-solid fa-up-right-from-square"></i>${esc(it.link.n)}</a>`:''}
        </div>`:''}
        ${planEdit?`<div class="editrow">
          <button data-ed="${it.id}"><i class="fa-solid fa-pen"></i> 編輯</button>
          <button data-mv="${it.id},-1" aria-label="往上移" ${idx===0?'disabled':''}><i class="fa-solid fa-arrow-up"></i></button>
          <button data-mv="${it.id},1" aria-label="往下移" ${idx===items.length-1?'disabled':''}><i class="fa-solid fa-arrow-down"></i></button>
          <button data-add="${it.id}"><i class="fa-solid fa-plus"></i> 在下面新增</button>
          <button data-rm="${it.id}" aria-label="刪除這項行程"><i class="fa-solid fa-trash"></i></button>
        </div>`:''}
      </div>
    </li>`).join('') || `<li><div class="slab box"><p style="margin:0">這天目前沒有行程。按「編輯這天的行程」新增。</p></div></li>`;
  $('#dayextra').innerHTML = (x.extra||[]).map(e=>`
    <details class="slab-flat" style="margin-bottom:10px"><summary>${esc(e.h)}<i class="fa-solid fa-chevron-down"></i></summary>
      <div class="inner"><ul>${e.li.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div></details>`).join('');
}
function planForm(it, isNew){
  const base = !isNew && isBaseId(it.id);
  openDlg(`<div class="pe"><h3 style="font-size:1.1rem">${isNew?'新增行程':'修改行程'}</h3>
    <label>時間<input id="pe-t" class="field" maxlength="20" placeholder="例如 14:00–15:30" value="${esc(it.t||'')}"></label>
    <label>要做什麼<input id="pe-title" class="field" maxlength="40" placeholder="例如：teamLab Planets" value="${esc(it.title||'')}"></label>
    <label>地點名稱或地址<input id="pe-q" class="field" maxlength="80" placeholder="例如：teamLab Planets 豊洲" value="${esc(it.q||'')}">
      <small>填了會自動帶出地圖和「查介紹」按鈕。${base?'也會取代這項原本的地圖按鈕。':''}</small></label>
    <label>備註或介紹<textarea id="pe-note" class="field" rows="3" maxlength="300" placeholder="門票、集合點、想買的東西">${esc(it.note||'')}</textarea></label>
    <label class="check" style="padding:8px 0"><input type="checkbox" id="pe-food" ${it.food?'checked':''}><span>這是餐廳，加上食記按鈕</span></label>
    <label class="check" style="padding:8px 0"><input type="checkbox" id="pe-key" ${it.key?'checked':''}><span>標成重點，用醒目顏色顯示</span></label>
    <p id="pe-err" style="margin:6px 0 0;color:#c2264f;font-weight:700;font-size:.85rem"></p></div>`, ()=>{
    const title = $('#pe-title').value.trim();
    if(!title){ $('#pe-err').textContent = '請填「要做什麼」。'; return false; }
    ledger.plan[it.id] = {id:it.id, day:it.day, pos:it.pos, t:$('#pe-t').value.trim(), title, note:$('#pe-note').value.trim(), q:$('#pe-q').value.trim(),
      food:$('#pe-food').checked, key:$('#pe-key').checked, at:Date.now()};
    changed();
  }, '儲存');
}
document.getElementById('tab-plan').addEventListener('click', e=>{
  const q = sel => e.target.closest(sel);
  if(q('#plan-edit')){ planEdit = !planEdit; renderDay(); return; }
  if(q('#plan-reset')){ openDlg('<p style="margin:0;font-weight:700">把這天還原成原本的行程？臨時新增和修改的內容都會移除。</p>', ()=>{
      Object.values(ledger.plan).forEach(r=>{ if(r.day === curDay) ledger.plan[r.id] = isBaseId(r.id) ? {id:r.id, day:r.day, orig:true, at:Date.now()} : {id:r.id, day:r.day, del:true, at:Date.now()}; });
      changed(); }, '還原'); return; }
  const items = dayItems(curDay), find = id => items.find(v=>v.id === id);
  let b;
  if((b = q('[data-ed]'))){ const it = find(b.dataset.ed); if(it) planForm(it, false); }
  else if((b = q('[data-add]'))){
    let pos; const ref = b.dataset.add;
    if(ref === 'top') pos = (items.length ? items[0].pos : 1000) - 500;
    else { const i = items.findIndex(v=>v.id === ref); if(i < 0) return; pos = i === items.length-1 ? items[i].pos + 1000 : (items[i].pos + items[i+1].pos)/2; }
    planForm({id:'x' + uid(), day:curDay, pos}, true);
  }
  else if((b = q('[data-mv]'))){
    const [id, dir] = b.dataset.mv.split(','), i = items.findIndex(v=>v.id === id), j = i + (+dir);
    if(i < 0 || j < 0 || j >= items.length) return;
    const A = toRec(items[i]), B = toRec(items[j]); [A.pos, B.pos] = [B.pos, A.pos];
    if(A.pos === B.pos) A.pos += +dir * 0.5;
    ledger.plan[A.id] = A; ledger.plan[B.id] = B; changed();
  }
  else if((b = q('[data-rm]'))){ const it = find(b.dataset.rm); if(it) askDelete(`刪除「${it.title}」？之後可以用「還原這天」找回原本的行程。`, ()=>{
      ledger.plan[it.id] = {id:it.id, day:it.day, del:true, at:Date.now()}; changed(); }); }
});
$('#days').addEventListener('click', e=>{
  const b = e.target.closest('.daycard'); if(!b) return;
  curDay = +b.dataset.i; renderDays(); renderDay();
});
function renderCountdown(){
  const t = todayJST(), ms = 864e5;
  const diff = Math.round((Date.parse('2026-12-02') - Date.parse(t))/ms);
  const el = $('#countdown');
  if(diff > 0) el.innerHTML = `還有<b class="disp">${diff}</b>天出發`;
  else if(diff >= -4) el.innerHTML = `今天是<b class="disp">DAY ${1-diff}</b>`;
  else el.innerHTML = `旅程<b class="disp">完成</b>`;
}

/* ========== WALLET：計算機 ========== */
let rate = store.get('tk_rate', 0.21);
let expr = '', lastVal = 0;
const KEYS = ['C','(',')','⌫','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'];
$('#keys').innerHTML = KEYS.map(k=>{
  const cls = k==='=' ? 'eq' : 'C⌫'.includes(k) ? 'fn' : '÷×−+()'.includes(k) ? 'op' : '';
  const lab = {C:'清除','⌫':'倒退','÷':'除','×':'乘','−':'減','+':'加','=':'等於'}[k] || k;
  return `<button type="button" class="${cls}" data-k="${k}" aria-label="${lab}">${k}</button>`;
}).join('');
function calc(src){                     // 自己解析四則運算，不用 eval
  const t = src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
  if(!t || !/^[0-9+\-*/().]+$/.test(t)) return NaN;
  let i = 0;
  const num = ()=>{ const m = /^(\d+\.?\d*|\.\d+)/.exec(t.slice(i)); if(!m) return NaN; i += m[0].length; return parseFloat(m[0]); };
  const factor = ()=>{ if(t[i] === '-'){ i++; return -factor(); } if(t[i] === '+'){ i++; return factor(); }
    if(t[i] === '('){ i++; const v = expr(); if(t[i] !== ')') return NaN; i++; return v; } return num(); };
  const term = ()=>{ let v = factor(); while(t[i] === '*' || t[i] === '/'){ const op = t[i++], r = factor(); v = op === '*' ? v*r : v/r; } return v; };
  const expr = ()=>{ let v = term(); while(t[i] === '+' || t[i] === '-'){ const op = t[i++], r = term(); v = op === '+' ? v+r : v-r; } return v; };
  const v = expr();
  return (i === t.length && isFinite(v)) ? v : NaN;
}
function showCalc(final){
  $('#c-expr').textContent = expr || '輸入算式，例如 500+200×3';
  const v = calc(expr);
  if(!isNaN(v)){ lastVal = v; $('#c-jpy').textContent = yen(v); $('#c-twd').textContent = '約 ' + ntd(v*rate); }
  else if(final && expr){ $('#c-jpy').textContent = '算式不完整'; $('#c-twd').textContent = '檢查括號或運算符號'; }
  else if(!expr){ lastVal = 0; $('#c-jpy').textContent = '¥0'; $('#c-twd').textContent = '約 NT$0'; }
}
$('#keys').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.k;
  if(k==='C') expr = '';
  else if(k==='⌫') expr = expr.slice(0,-1);
  else if(k==='='){ const v = calc(expr); if(!isNaN(v)){ showCalc(true); expr = String(Math.round(v*100)/100); $('#c-expr').textContent = '= ' + expr; return; } showCalc(true); return; }
  else expr += k;
  showCalc(false);
});

const N = 4;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const emptyLedger = () => ({v:1, members:['成員A','成員B','成員C','成員D'], mAt:0, items:[], del:[], plan:{}});
const okIdx = i => Number.isInteger(i) && i >= 0 && i < N;
function cleanLedger(o){
  const out = emptyLedger();
  if(!o || typeof o !== 'object') return out;
  if(Array.isArray(o.members) && o.members.length === N) out.members = o.members.map((m,i)=>String(m||'').trim().slice(0,12) || out.members[i]);
  out.mAt = Number(o.mAt) || 0;
  out.del = Array.isArray(o.del) ? o.del.filter(x=>typeof x === 'string').slice(-2000) : [];
  (Array.isArray(o.items) ? o.items : []).forEach(x=>{
    if(!x || typeof x.id !== 'string' || !x.id) return;
    const amt = Math.round(Number(x.amt)); if(!(amt > 0) || amt > 1e8 || !okIdx(x.payer)) return;
    const at = typeof x.at === 'string' ? x.at.slice(0,30) : '';
    if(x.t === 'p'){ if(!okIdx(x.to) || x.to === x.payer) return; out.items.push({id:x.id.slice(0,24), t:'p', amt, payer:x.payer, to:x.to, at}); }
    else { const split = [...new Set((Array.isArray(x.split) ? x.split : []).filter(okIdx))].sort(); if(!split.length) return;
      out.items.push({id:x.id.slice(0,24), t:'e', name:String(x.name||'').slice(0,40) || '未命名', amt, payer:x.payer, split, at}); }
  });
  const P = o.plan && typeof o.plan === 'object' ? o.plan : {}, str = (v,n) => String(v == null ? '' : v).slice(0,n);
  Object.keys(P).slice(0,400).forEach(k=>{
    const r = P[k]; if(!r || typeof r.id !== 'string' || r.id !== k || k.length > 24) return;
    const day = Number(r.day), at = Number(r.at) || 0; if(!Number.isInteger(day) || day < 0 || day > 4) return;
    if(r.orig){ out.plan[k] = {id:k, day, orig:true, at}; return; }
    if(r.del){ out.plan[k] = {id:k, day, del:true, at}; return; }
    const pos = Number(r.pos), title = str(r.title,40).trim(); if(!isFinite(pos) || !title) return;
    out.plan[k] = {id:k, day, pos, t:str(r.t,20), title, note:str(r.note,300), q:str(r.q,80), food:!!r.food, key:!!r.key, at};
  });
  return out;
}
function mergeLedger(a, b){
  const out = emptyLedger(), newer = (b.mAt||0) > (a.mAt||0) ? b : a;
  out.members = newer.members.slice(); out.mAt = newer.mAt || 0;
  out.del = [...new Set([...a.del, ...b.del])];
  const gone = new Set(out.del), map = new Map();
  [...a.items, ...b.items].forEach(x=>{ if(!gone.has(x.id)) map.set(x.id, x); });
  out.items = [...map.values()].sort((x,y)=>(y.at||'').localeCompare(x.at||'') || y.id.localeCompare(x.id));
  [a.plan, b.plan].forEach(P=>Object.values(P).forEach(r=>{ const c = out.plan[r.id]; if(!c || r.at > c.at) out.plan[r.id] = r; }));
  return out;
}

function balances(){
  const paid = Array(N).fill(0), share = Array(N).fill(0), net = Array(N).fill(0); let total = 0;
  ledger.items.forEach(x=>{
    if(x.t === 'p'){ net[x.payer] += x.amt; net[x.to] -= x.amt; return; }
    total += x.amt; paid[x.payer] += x.amt; net[x.payer] += x.amt;
    x.split.forEach(i=>{ share[i] += x.amt / x.split.length; net[i] -= x.amt / x.split.length; });
  });
  return {paid, share, net, total};
}
function transfers(net){                 // 最大債務人對最大債權人，轉帳次數最少
  const c = [], d = [];
  net.forEach((n,i)=>{ const r = Math.round(n); if(r > 0) c.push([i,r]); else if(r < 0) d.push([i,-r]); });
  c.sort((a,b)=>b[1]-a[1]); d.sort((a,b)=>b[1]-a[1]);
  const out = []; let i = 0, j = 0;
  while(i < d.length && j < c.length){
    const m = Math.min(d[i][1], c[j][1]);
    if(m > 0) out.push({from:d[i][0], to:c[j][0], amt:m});
    d[i][1] -= m; c[j][1] -= m; if(!d[i][1]) i++; if(!c[j][1]) j++;
  }
  return out;
}

function compress(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const max = 480, k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

const HEAD = "<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#1D2440\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<title>TOKYO 2026 旅行小幫手<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<script>\n  if (window.tailwind) tailwind.config = {\n    theme: { extend: {\n      colors: { ink:'#1D2440', paper:'#F2F5EE', glow:'#C9F2C7', pink:'#FF5C8A', teal:'#12A594', sun:'#FFD23F', sky:'#4C6FFF' },\n      fontFamily: { disp:['\"Dela Gothic One\"','\"Noto Sans TC\"','sans-serif'], body:['\"Noto Sans TC\"','system-ui','sans-serif'] }\n    } }\n  }\n<\/script>\n<script>window.__fxImport = function(u){ return import(u, {with:{type:\"json\"}}); };<\/script>\n";
function buildDoc(state){                // 把目前帳本寫進新的一版頁面
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n' + HEAD + '<style id="css">' + document.getElementById('css').textContent + '</style>\n</head>\n<body>\n' +
    '<template id="shell">' + document.getElementById('shell').innerHTML + '</template>\n' +
    '<script id="shared" type="application/json">' + json + '</' + 'script>\n' +
    '<script id="app">' + document.getElementById('app').textContent + '</' + 'script>\n</body>\n</html>\n';
}
let art = null, syncMode = 'none', syncTimer = null, syncErr = '';   // none | ready | saving | readonly
const pending = () => sig(ledger) !== sig(shared);
function renderSync(){
  const btn = $('#sync-now'); btn.hidden = !(art && syncMode !== 'readonly' && syncMode !== 'saving' && pending());
  let m;
  if(syncMode === 'saving') m = '同步中，頁面會自動重新整理。';
  else if(syncMode === 'readonly') m = '你目前只能看共同帳本，新增的帳先存在這支手機。請用同步碼傳給有編輯權限的人，或請主揪開放編輯。';
  else if(art) m = pending() ? '這支手機有還沒上傳的變更。' : '帳本和行程修改都已同步。每次打開頁面都會拿到最新版本。';
  else m = hasShared ? '共同帳本已載入。這支手機新增的帳，用同步碼傳給朋友合併。' : '帳本存在這支手機，沒有網路也能記。用同步碼和朋友合併。';
  $('#sync-msg').textContent = m + (syncErr ? ' ' + syncErr : '');
}
async function doSync(){
  if(!art || syncMode === 'saving' || !pending()) return;
  syncMode = 'saving'; syncErr = ''; renderSync();
  try{ await art.publish(buildDoc(ledger)); shared = cleanLedger(ledger); syncMode = 'ready'; }
  catch(e){ const code = String((e && (e.code || e.message)) || e);
    if(/not_granted|not_writer/.test(code)) syncMode = 'readonly';
    else { syncMode = 'ready'; syncErr = /conflict/.test(code) ? '剛好有人同時更新，頁面重新整理後再按一次同步。' : '這次沒同步成功，稍後再按一次。'; } }
  renderSync();
}
function queueSync(){ if(!art || syncMode === 'readonly') return; clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 1500); }
$('#sync-now').addEventListener('click', doSync);
try{ if(window.claude && typeof window.claude.use === 'function') window.claude.use('artifact').then(a=>{ if(a){ art = a; syncMode = 'ready'; renderSync(); } }, ()=>{}); }catch(e){}

function linkify(text){
  const re = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi;
  let out = '', last = 0, m;
  while((m = re.exec(text))){
    out += esc(text.slice(last, m.index));
    const raw = m[0].replace(/[),.。，、！？!?]+$/,''); re.lastIndex = m.index + raw.length;
    const href = raw.startsWith('http') ? raw : 'https://' + raw;
    let host = raw; try{ host = new URL(href).hostname.replace(/^www\./,''); }catch(e){}
    out += `<a class="btn btn-sun" style="margin:4px 0;max-width:100%" target="_blank" rel="noopener noreferrer" href="${esc(href)}"><i class="fa-solid fa-link"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(host)}</span></a>`;
    last = m.index + raw.length;
  }
  return (out + esc(text.slice(last))).replace(/\n/g,'<br>');
}

let setupDone = store.get('tk_setup', {});
function copyText(txt, btn){
  const old = btn.innerHTML, ok = ()=>{ btn.classList.add('ok'); btn.textContent = '已複製'; setTimeout(()=>{ btn.classList.remove('ok'); btn.innerHTML = old; }, 1400); };
  const fallback = ()=>{ const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); let done = false; try{ done = document.execCommand('copy'); }catch(e){} ta.remove();
    if(done) ok(); else openDlg(`<p style="margin:0 0 8px;font-weight:700">長按下面文字複製</p><textarea class="field" rows="2" readonly>${esc(txt)}</textarea>`); };
  try{ if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback(); }catch(e){ fallback(); }
}
function renderSetup(){
  const openIds = [...document.querySelectorAll('#setup details[open]')].map(d=>d.dataset.g);
  $('#setup').innerHTML = SETUP.map(g=>{
    const n = g.steps.filter((_,i)=>setupDone[g.id+i]).length;
    return `<details class="slab-flat" data-g="${g.id}" ${openIds.includes(g.id)?'open':''}>
      <summary><span><i class="fa-solid ${g.icon}"></i> ${esc(g.title)}<br><small style="font-weight:500;color:#4a516b">${esc(g.when)}</small></span>
        <span style="display:flex;align-items:center;gap:8px;white-space:nowrap"><span class="chip" style="${n===g.steps.length?'background:var(--teal);color:#fff':''}">${n} / ${g.steps.length}</span><i class="fa-solid fa-chevron-down"></i></span></summary>
      <div class="inner"><p style="margin:0 0 4px">${esc(g.intro)}</p>
      ${g.steps.map((st,i)=>`<div class="step ${setupDone[g.id+i]?'done':''}">
        <div class="no disp">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="st">${esc(st.t)}</div>
          ${st.d?`<p class="sd">${esc(st.d)}</p>`:''}
          ${st.li?`<ul>${st.li.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
          ${(st.copy||[]).map(c=>`<div class="copyrow"><div style="flex:1;min-width:0"><div class="k">${esc(c[0])}</div><div class="v">${esc(c[1])}</div></div><button type="button" data-copy="${esc(c[1])}">複製</button></div>`).join('')}
          ${st.after?`<p class="sd">${esc(st.after)}</p>`:''}
          ${st.link?`<a class="btn btn-sun" style="margin-top:10px" target="_blank" rel="noopener" href="${st.link[1]}"><i class="fa-solid fa-up-right-from-square"></i>${esc(st.link[0])}</a>`:''}
          <div><button type="button" class="donebtn" data-step="${g.id+i}" aria-pressed="${!!setupDone[g.id+i]}">${setupDone[g.id+i]?'已完成，點一下取消':'這步完成'}</button></div>
        </div></div>`).join('')}
      </div></details>`; }).join('');
}
$('#setup').addEventListener('click', e=>{
  const c = e.target.closest('[data-copy]'), d = e.target.closest('[data-step]');
  if(c) copyText(c.dataset.copy, c);
  if(d){ setupDone[d.dataset.step] = !setupDone[d.dataset.step]; store.set('tk_setup', setupDone); renderSetup(); }
});

/* ========== 分頁切換 ========== */
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.id === 'tab-'+name));
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab === name));
  store.set('tk_tab', name); window.scrollTo(0,0);
}
document.querySelector('.nav').addEventListener('click', e=>{ const b = e.target.closest('button'); if(b) showTab(b.dataset.tab); });
