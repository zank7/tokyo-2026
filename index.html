<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow-x:hidden;touch-action:manipulation}
  body{background:#1D2440;color:#fff;font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;display:grid;place-items:center;padding:24px}
  main{width:100%;max-width:340px;text-align:center}
  h1{font-size:2rem;margin:0;color:#C9F2C7;letter-spacing:.02em}
  p{color:#cfd5ea;margin:.5rem 0 1.4rem;font-size:.95rem;line-height:1.6}
  .dots{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
  .dots i{width:18px;height:18px;border-radius:50%;border:2px solid #C9F2C7}
  .dots i.on{background:#C9F2C7}
  #msg{min-height:1.6em;font-weight:700;font-size:.9rem;color:#FFD23F;margin-bottom:10px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pad button{min-height:64px;font:700 1.5rem system-ui,sans-serif;color:#1D2440;background:#fff;border:2px solid #fff;border-radius:16px;box-shadow:3px 3px 0 #FF5C8A;cursor:pointer}
  .pad button:active{transform:translate(3px,3px);box-shadow:none}
  .pad button.fn{background:transparent;color:#fff;box-shadow:none;font-size:1rem}
  .pad button:focus-visible{outline:3px solid #FFD23F;outline-offset:2px}
  label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:18px;color:#cfd5ea;font-size:.9rem}
  input[type=checkbox]{width:20px;height:20px;accent-color:#12A594}
  .shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
